<!doctype html><html><head><meta charset=utf8><link rel="icon" href="data:,"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>악녀빙의: 수도원의 마차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 9:16 영상 무대 하나에 자막·선택·카드를 겹친다. 사망 화면만 붉은 계열로 바꾼다. */
  :root {
    color-scheme: dark;
    --ink: #2b2420; --paper: #f7f0e6; --gold: #c9a35b; --night: #10141c; --shade: rgba(12, 15, 22, .82);
    --blood: #8e1f2c; --blood-l: #d9485a; --line: rgba(201, 163, 91, .55);
    --serif: 'Gowun Batang', 'AppleMyungjo', serif; --sans: 'Noto Sans KR', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07090d; color: var(--paper); font-family: var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { position: relative; height: 100%; max-width: calc(100vh * 9 / 16); margin: 0 auto; overflow: hidden; background: var(--night); }
  #clip, #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #still { background-size: cover; background-position: center; opacity: 0; transition: opacity .3s; }
  #still.show { opacity: 1; }
  #still.kb { animation: kb 9s ease-out forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.08); } }
  #skip { position: absolute; z-index: 6; top: max(12px, env(safe-area-inset-top)); right: 12px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(10,12,18,.5); font-size: 12px; }

  #sub { position: absolute; z-index: 5; left: 16px; right: 16px; bottom: max(36px, env(safe-area-inset-bottom)); text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #sub.show { opacity: 1; }
  #subWho { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 6px; background: var(--gold); color: var(--ink); font-size: 13px; font-weight: 700; }
  #subWho[hidden] { display: none; }
  #subText { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.6; word-break: keep-all; text-shadow: 0 1px 4px #000, 0 0 12px #000; }

  #choice { position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; padding: 60px 16px max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(8,10,15,.95) 70%, transparent); display: none; flex-direction: column; gap: 10px; }
  #choice.show { display: flex; }
  .cPrompt { margin: 0; text-align: center; font-family: var(--serif); color: var(--gold); font-size: 17px; }
  .cTimer { height: 4px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
  .cTimer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--blood-l), var(--gold)); }
  .cOpt { padding: 15px 16px; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: rgba(247,240,230,.94); color: var(--ink); font-family: var(--serif); font-size: 15.5px; line-height: 1.45; }
  .cOpt:active { background: var(--gold); }

  #chapter { position: absolute; z-index: 8; inset: 0; display: grid; place-items: center; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #chapter.show { opacity: 1; }
  #chapter p { font-family: var(--serif); font-size: 24px; color: var(--gold); letter-spacing: 2px; }

  #overlay { position: absolute; z-index: 20; inset: 0; display: none; }
  #overlay.show { display: block; }
  #overlay.dead { background: radial-gradient(circle at 50% 35%, rgba(142,31,44,.55), rgba(5,5,8,.94) 70%); animation: deadIn .6s; }
  #overlay.ended { background: linear-gradient(to bottom, transparent 35%, rgba(5,6,10,.92) 70%); }
  @keyframes deadIn { from { background-color: #fff; } }
  .deathCard { position: absolute; left: 16px; right: 16px; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; text-align: center; }
  .dNo { margin: 0; color: var(--blood-l); font-size: 13px; letter-spacing: 4px; font-weight: 700; }
  .deathCard h2 { margin: 0; font-family: var(--serif); font-size: 32px; text-wrap: balance; }
  .deathCard.end h2 { color: var(--gold); }
  .dCause { margin: 0; font-size: 14px; color: rgba(247,240,230,.75); }
  .deathCard { max-height: calc(100% - 40px); overflow-y: auto; }
  .clue { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px dashed rgba(230,200,140,.5); }
  .clue img { width: 54px; height: 96px; object-fit: cover; border-radius: 8px; flex: none; }
  .clue small { color: var(--gold); font-size: 12px; letter-spacing: .04em; }
  .clue p { margin: 2px 0 0; font-family: var(--serif); font-size: 15px; line-height: 1.5; }
  .clue b { font-size: 13px; color: var(--gold); margin-right: 2px; }
  .notes { text-align: left; font-size: 13px; opacity: .85; }
  .notes summary { cursor: pointer; text-align: center; }
  .notes ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }
  .echo { display: flex; gap: 12px; align-items: center; text-align: left; margin: 8px 0; padding: 12px; border-radius: 14px; background: var(--shade); border: 1px solid rgba(217,72,90,.4); }
  .echo img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; }
  .echo b { font-size: 13px; color: var(--gold); }
  .echo p { margin: 2px 0 0; font-family: var(--serif); font-size: 16px; line-height: 1.5; }
  .dCount { margin: 0; font-size: 12px; color: rgba(247,240,230,.6); }
  .primary, .ghost { padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; }
  .primary { background: var(--gold); color: var(--ink); border: 0; }
  .ghost { background: rgba(10,12,18,.6); border: 1px solid var(--line); }

  .title { position: absolute; inset: 0; }
  .title .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .title::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(10,12,18,.94) 78%); }
  .tText { position: absolute; z-index: 1; left: 0; right: 0; bottom: 230px; text-align: center; }
  .tText h1 { margin: 0; font-family: var(--serif); font-size: 56px; letter-spacing: 4px; color: #fff3da; }
  .tText .sub { margin: 4px 0 0; font-family: var(--serif); font-size: 22px; color: var(--gold); }
  .tText .meta { margin: 8px 0 0; font-size: 13px; color: rgba(247,240,230,.7); }
  .tBtns { position: absolute; z-index: 1; left: 24px; right: 24px; bottom: max(32px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .panel { position: absolute; inset: 0; padding: 40px 18px 24px; background: #0b0d13; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { margin: 0; font-family: var(--serif); color: var(--blood-l); }
  .note { margin: 0; font-size: 13px; color: rgba(247,240,230,.7); }
  .book { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .book li { padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); color: rgba(247,240,230,.35); font-family: var(--serif); font-size: 14px; min-height: 64px; }
  .book li span { display: block; font-family: var(--sans); font-size: 11px; color: rgba(217,72,90,.6); }
  .book li.got { color: var(--paper); border: 1px solid rgba(217,72,90,.45); }
  .book li small { display: block; margin-top: 4px; font-family: var(--sans); font-size: 11px; color: rgba(247,240,230,.6); }


  /* ── 악녀빙의 추가: 상태창 HUD · 도감 탭 · 그림 없는 장면 폴백 · 영어 검수 자막 ── */
  #hud { position: absolute; z-index: 6; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; pointer-events: none; }
  #hud[hidden] { display: none; }
  #hud span { padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(120,170,255,.45); background: rgba(10,16,30,.62); color: #dbe7ff; font-size: 11px; line-height: 1.4; white-space: nowrap; transition: background .2s, color .2s; }
  #hud span b { margin-left: 4px; color: #fff; font-weight: 700; }
  #hud span.fate { border-color: rgba(217,72,90,.6); color: #ffd9de; }
  #hud span.hi { background: var(--gold); color: var(--ink); }
  #hud span.hi b { color: var(--ink); }
  #skip { top: calc(max(10px, env(safe-area-inset-top)) + 54px); }
  #codexBtn { position: absolute; z-index: 6; top: calc(max(10px, env(safe-area-inset-top)) + 54px); left: 12px; width: 34px; height: 30px; border-radius: 99px; border: 1px solid var(--line); background: rgba(10,12,18,.5); font-size: 15px; padding: 0; }
  #codexBtn[hidden] { display: none; }
  #still .noart { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; padding: 120px 24px 24px; background: radial-gradient(circle at 50% 40%, #1b2130, #07090d 75%); text-align: center; }
  #still .noart b { font-size: 28px; letter-spacing: 4px; color: var(--gold); font-family: var(--serif); }
  #still .noart p { margin: 0; font-size: 12px; line-height: 1.6; color: rgba(247,240,230,.55); word-break: break-word; }
  #subEn { margin: 4px 0 0; font-size: 12px; line-height: 1.4; color: rgba(247,240,230,.8); text-shadow: 0 1px 3px #000; }
  #subEn[hidden] { display: none; }
  #codex { position: absolute; z-index: 30; inset: 0; display: none; }
  #codex.show { display: block; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tabs button { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-family: var(--serif); font-size: 15px; }
  .tabs button.on { background: var(--gold); color: var(--ink); font-weight: 700; }
  .novel { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .novel li { padding: 12px; border-radius: 10px; background: rgba(247,240,230,.06); border-left: 3px solid var(--gold); font-family: var(--serif); font-size: 15px; line-height: 1.65; word-break: keep-all; }
  .novel li span { display: block; font-family: var(--sans); font-size: 11px; color: var(--gold); margin-bottom: 2px; }
  .panel h2.gold { color: var(--gold); }
  /* 텍스트 사망(영상 없음): 검정 화면에 흰 세리프 서술이 한 줄씩 떠오른다 */
  #tdeath { position: absolute; z-index: 15; inset: 0; display: none; flex-direction: column; justify-content: center; gap: 22px; padding: 32px 28px; background: #000; text-align: center; cursor: pointer; }
  #tdeath.show { display: flex; }
  #tdeath p { margin: 0; font-family: var(--serif); font-size: 19px; line-height: 1.9; color: #fff; word-break: keep-all; opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; }
  #tdeath p.in { opacity: 1; transform: none; }
  #overlay.dead.plain { background: transparent; animation: none; }
  /* 서장 페이지(책 읽기) · 힌트 버튼 */
  #tdeath.book { justify-content: center; padding: 48px 34px 64px; }
  #tdeath .page { font-size: 18px; line-height: 2; white-space: pre-line; text-align: center; transition-duration: 1.1s; }
  #tdeath .pno { position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); font-size: 12px; color: rgba(255,255,255,.45); letter-spacing: 2px; }
  .hintBtn { padding: 10px 14px; font-size: 14px; font-weight: 500; border-style: dashed; }
  .hintWhere { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; color: rgba(247,240,230,.6); font-family: var(--serif); }
  /* 코믹스: 탭 받는 투명 막 · 줄 번호 · 지문 */
  #tap { position: absolute; z-index: 4; inset: 0; display: none; cursor: pointer; }
  #tap.on { display: block; }
  #lineNo { position: absolute; z-index: 5; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); margin: 0; text-align: center; font-size: 11px; letter-spacing: 2px; color: rgba(247,240,230,.5); pointer-events: none; }
  #lineNo[hidden] { display: none; }
  #sub.narr #subText { color: rgba(247,240,230,.8); font-style: italic; }
  @media (prefers-reduced-motion: reduce) { #still.kb { animation: none; } }
</style>


<div id="app">
  <video id="clip" playsinline preload="auto"></video>
  <div id="still"></div>
  <div id="tap"></div>
  <p id="lineNo" hidden></p>
  <div id="hud" hidden></div>
  <button id="codexBtn" type="button" aria-label="도감" hidden>📖</button>
  <button id="skip" type="button">넘기기 ▶▶</button>
  <div id="sub"><span id="subWho"></span><p id="subText"></p><p id="subEn" hidden></p></div>
  <div id="choice"></div>
  <div id="chapter"></div>
  <div id="tdeath"></div>
  <div id="overlay"></div>
  <div id="codex"></div>
</div>
<script src="js/scenes.js?v=1"></script>
<script src="js/player.js?v=1"></script>



</body></html>
